[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pipeline-reviewer"
version = "0.1.0"
description = "AI agent that reviews GitLab CI pipelines for DORA metric anti-patterns"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["gitlab", "ci", "dora", "devops", "platform-engineering", "ai", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
]

[project.scripts]
pipeline-review = "agent_pipeline_reviewer.cli:main"

[project.urls]
Homepage = "https://github.com/wb-platform-engineering-lab/agent-pipeline-reviewer"
Repository = "https://github.com/wb-platform-engineering-lab/agent-pipeline-reviewer"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_pipeline_reviewer*"]
